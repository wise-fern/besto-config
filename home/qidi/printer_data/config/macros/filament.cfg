[gcode_macro UNLOAD_FILAMENT]
description: filament unload
gcode:
    M603
# uncomment if using spoolman
   {action_call_remote_method(
     "spoolman_set_active_spool",
     spool_id=None
   )}

[gcode_macro LOAD_FILAMENT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Pick temperature"
    RESPOND TYPE=command MSG="action:prompt_button 220|_LOAD_FILAMENT_WITH_TEMP S=220|primary"
    RESPOND TYPE=command MSG="action:prompt_button 250|_LOAD_FILAMENT_WITH_TEMP S=250|primary"
    RESPOND TYPE=command MSG="action:prompt_button 270|_LOAD_FILAMENT_WITH_TEMP S=270|primary"
    RESPOND TYPE=command MSG="action:prompt_button 300|_LOAD_FILAMENT_WITH_TEMP S=300|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _LOAD_FILAMENT_WITH_TEMP]
gcode:
    {% set mode = params.T|default(0)|int %}
    {% set temp = params.S|default(250)|int %}

    M604 T{mode} S{temp}

    RESPOND TYPE=command MSG="action:prompt_begin Loading successful?"
    RESPOND TYPE=command MSG="action:prompt_button Yes|RESPOND MSG='Done loading.'|primary"
    RESPOND TYPE=command MSG="action:prompt_button No|_LOAD_FILAMENT_WITH_TEMP T=1 S={temp}|error"
    RESPOND TYPE=command MSG="action:prompt_show"