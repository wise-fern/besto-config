[gcode_macro PRINT_START]
gcode:
    M118 Preparing for print
    M117 Preparing for print
    DISABLE_ALL_SENSOR
    CLEAR_PAUSE
    
    {% set bedtemp = params.get('BED') | int %}
    {% set hotendtemp = params.get('HOTEND') | int %}
    {% set chambertemp = params.get('CHAMBER', 0) | int %}
    {% set extruder = params.EXTRUDER|default(0)|int %}
    {% set Polar_cooler = printer.save_variables.variables.enable_polar_cooler|default(0) %}

    M104 S0
    {% if chambertemp == 0 %}
        M106 P3 S255
    {% endif %}
    M140 S{bedtemp}    
    M118 Homing print head
    M117 Homing print head
    G28   
    M141 S{chambertemp}    
    SET_GCODE_OFFSET Z=0 MOVE=0
    M118 Clearing nozzle
    M117 Clearing nozzle
    CLEAR_NOZZLE HOTEND={hotendtemp}
    M104 S140
    G4 P3000
    M400
    G28
    M118 Performing z-tilt-adjust
    M117 Performing z-tilt-adjust
    Z_TILT_ADJUST
    
    M104 S140
    M118 Waiting for bed temperature
    M117 Waiting for bed temperature
    
    M190 S{bedtemp}
    
    M118 Waiting for chamber temperature
    M117 Waiting for chamber temperature
    M191 S{chambertemp}
    M400
    G4 P3000
    M118 Gathering bed mesh
    M117 Gathering bed mesh
    
    BED_MESH_CALIBRATE ADAPTIVE=1
    G0 Z50 F600
    G0 X260 Y5  F30000
    M191 S{chambertemp}
    M109 S{hotendtemp}
    M204 S10000
    M106 P4 S{Polar_cooler}

    ENABLE_ALL_SENSOR
    M118 Starting print
    M117 Starting print


[gcode_macro PRINT_END]
gcode:
    {% set max_print_height = printer.toolhead.axis_maximum.z - 20 %}
    {% set max_layer_z = printer.toolhead.position.z %}
    M400
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    CLEAR_PAUSE
    M106 P2 S0
    M106 P0 S0
    M106 P4 S0

    M104 S0
    M140 S0
    M141 S0

    M220 S100
    M221 S100

    {% if max_layer_z < max_print_height / 2 %}
        G1 Z{max_print_height / 2 + 10} F600
    {% else %}
        G1 Z{min(max_print_height, max_layer_z + 3)}
    {% endif %}

    MOVE_TO_TRASH
    DISABLE_ALL_SENSOR
    BED_MESH_CLEAR
    G31
    M84
    BEEP I=2 DUR=500