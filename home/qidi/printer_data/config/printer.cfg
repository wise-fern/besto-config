[include config/*.cfg]
[include macros/*.cfg]
[include fluidd.cfg]
[include timelapse.cfg]

# ============ Klipper宏库配置 ============
[gcode_macro _km_options]
# Any options variables declared here
gcode:
  # GCODE_ON_PRINT_STATUS STATUS=ready COMMAND="STATUS_TEST" ARGS=1 WHEN=ALWAYS TYPE=BOTH
  # GCODE_ON_PRINT_STATUS STATUS=leveing_calibration COMMAND="STATUS_TEST" ARGS=1 WHEN=ALWAYS TYPE=BOTH


[gcode_macro status_test]
variable_extruder: 0
gcode:
  M118 STATUS_TEST {rawparams}

[gcode_macro _CLIENT_VARIABLE]
variable_park_at_cancel_x : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_park_at_cancel_y : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
# !!! Caution [firmware_retraction] must be defined in the printer.cfg if you set use_fw_retract: True !!!
#                                   Specify the config name of the runout sensor e.g "filament_switch_sensor runout". Hint use the same as in your printer.cfg
# !!! Custom macros, please use with care and review the section of the corresponding macro.
# These macros are for simple operations like setting a status LED. Please make sure your macro does not interfere with the basic macro functions.
# Only  single line commands are supported, please create a macro if you need more than one command.
variable_user_pause_macro : ""    ; Everything inside the "" will be executed after the klipper base pause (PAUSE_BASE) function
variable_user_resume_macro: ""    ; Everything inside the "" will be executed before the klipper base resume (RESUME_BASE) function
variable_user_cancel_macro: ""    ; Everything inside the "" will be executed before the klipper base cancel (CANCEL_PRINT_BASE) function
gcode:

[respond]
default_type: echo

[save_variables] 
filename =~/printer_data/config/saved_variables.cfg

[resonance_tester]
accel_per_hz: 150
max_smoothing:0.25
accel_chip:lis2dw
probe_points:
   135, 135, 10        

[duplicate_pin_override]
pins:
  THR:PA11

[filament_switch_sensor filament_switch_sensor]
pause_on_runout: True     
runout_gcode:             
            M118 Filament run out
            {% set enable_box = printer.save_variables.variables.enable_box|default(0) %}
            {% if enable_box == 1 %}
              {% set can_auto_reload = printer.save_variables.variables.auto_reload_detect|default(0) %}
              {% if can_auto_reload == 1 and printer["box_extras"]%}
                AUTO_RELOAD_FILAMENT
              {% else %}
                SET_PRINT_SUB_STATUS SUB_STATUS=box_filament_exhausted
              {% endif %}
            {% else %}
              SET_PRINT_SUB_STATUS SUB_STATUS=ext_filament_exhausted
            {% endif %}
insert_gcode:             # 插入耗材时执行的代码
event_delay: 3.0          # 事件延迟时间
pause_delay: 0.5          # 暂停延迟时间
switch_pin:!THR:PA1       # 检测开关引脚

[force_move]
enable_force_move : True

[extruder]
step_pin:THR:PB9
dir_pin:!THR:PB8
enable_pin:!THR:PC15
rotation_distance: 53.7   
gear_ratio: 1517:170      
microsteps: 16           
full_steps_per_rotation: 200  

nozzle_diameter: 0.400    
filament_diameter: 1.75   
min_temp: 0               
max_temp: 375             
min_extrude_temp: 135     
smooth_time: 0.000001         

heater_pin:THR:PB15       
sensor_type:MAX6675       
sensor_pin:THR:PB12       
spi_bus: spi2_PB14_PC0_PB13
spi_speed:2000000         
max_power: 1              

pressure_advance: 0.032                
pressure_advance_smooth_time: 0.03     
max_extrude_cross_section:500          
instantaneous_corner_velocity: 10.000  
max_extrude_only_distance: 1000.0     
max_extrude_only_velocity:5000        
max_extrude_only_accel:5000           

[tmc2209 extruder]
uart_pin:THR:PC13         
interpolate: True         
run_current: 0.857        
stealthchop_threshold: 0  

[lis2dw]
cs_pin:THR:PA10                    
spi_software_sclk_pin:THR:PA5      
spi_software_mosi_pin:THR:PA7      
spi_software_miso_pin:THR:PA6      
axes_map: y, z, -x           

[printer]
kinematics:corexy
max_velocity: 600
max_accel: 20000
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 8

[stepper_x]
step_pin:PB4
dir_pin:!PB3
enable_pin:!PB5
microsteps:16
rotation_distance: 38.82
full_steps_per_rotation:200  
endstop_pin:tmc2240_stepper_x:virtual_endstop
position_min: -1
position_endstop: 271
position_max:275
homing_speed:50
homing_retract_dist:0
homing_positive_dir:true

[stepper_y]
step_pin:PC14
dir_pin:!PC13
enable_pin:!PC15
microsteps: 16
rotation_distance: 38.82
full_steps_per_rotation:200  
endstop_pin:tmc2240_stepper_y:virtual_endstop
position_min: -1
position_endstop: -1
position_max: 295
homing_speed:50
homing_retract_dist:0
homing_positive_dir:False

[stepper_z]
step_pin:PC10
dir_pin:PA15
enable_pin:!PC11
microsteps: 128
rotation_distance: 4
full_steps_per_rotation: 200
endstop_pin:probe:z_virtual_endstop 
position_max:265
position_min: -3
homing_speed: 10
second_homing_speed: 5
homing_retract_dist: 10.0
homing_positive_dir:false

[stepper_z1]
step_pin:PB1
dir_pin:PB6
enable_pin:!PB0
microsteps: 128
rotation_distance: 4
full_steps_per_rotation: 200

[z_tilt]
z_positions:
    -15,137
    285,137

points:
    10,137
    260,137

speed: 150
horizontal_move_z: 5
retries: 2
retry_tolerance: 0.05

[tmc2240 stepper_x]
spi_software_sclk_pin:PA5
spi_software_miso_pin:PA6
spi_software_mosi_pin:PA7
spi_speed:200000
cs_pin:PC12
diag0_pin:!PB8
interpolate:true
run_current: 1.07
stealthchop_threshold:0
driver_SGT:1

[tmc2240 stepper_y]
spi_software_sclk_pin:PA5
spi_software_miso_pin:PA6
spi_software_mosi_pin:PA7
spi_speed:200000
cs_pin:PD2
diag0_pin:!PC0
interpolate:true
run_current: 1.07
stealthchop_threshold:0
driver_SGT:1

[tmc2209 stepper_z]
uart_pin: PC5
run_current: 1.07
interpolate: True
stealthchop_threshold: 9999999999
diag_pin:^PC1
driver_SGTHRS:140

[tmc2209 stepper_z1]
uart_pin: PB7
run_current: 1.07
interpolate: True
stealthchop_threshold: 9999999999
diag_pin:^PA14
driver_SGTHRS:140

[heater_bed]
heater_pin: PC7
sensor_type:NTC 100K MGB18-104F39050L32
sensor_pin: PA4
max_power: 1.0
pwm_cycle_time:0.1
min_temp: -60
max_temp: 125

[heater_generic chamber]
heater_pin:PC8
max_power:1
sensor_type:NTC 100K MGB18-104F39050L32
sensor_pin:PA1

control = pid
pid_Kp=63.418 
pid_Ki=1.342 
pid_Kd=749.125

min_temp:-100
max_temp:70

[verify_heater chamber]
max_error: 300
check_gain_time:480
hysteresis: 5
heating_gain: 1

[temperature_sensor _Chamber_Thermal_Protection_Sensor]
sensor_type:NTC 100K MGB18-104F39050L32
sensor_pin:PA2
min_temp:-100
max_temp:150

[verify_heater extruder]
max_error: 120            
check_gain_time:20        
hysteresis: 2             
heating_gain: 2           

[verify_heater heater_bed]
max_error: 400            
check_gain_time:120       
hysteresis: 2             
heating_gain: 1           

[fan_generic chamber_circulation_fan]
pin: PA10                
shutdown_speed: 1.0      
cycle_time: 0.0100        
hardware_pwm: false       
kick_start_time: 0.100    
off_below: 0.0            

[controller_fan chamber_fan]
pin:PB14                  
max_power: 1.0            
shutdown_speed: 1.0         
kick_start_time: 0.5      
heater:chamber            
fan_speed: 1.0            
off_below: 0              
tachometer_pin:PC6        
tachometer_ppr: 2        
tachometer_poll_interval: 0.0015  
stepper:                  
 
[heater_fan hotend_fan]
pin:THR:PA11
max_power: 1.0           
shutdown_speed:1.0       
kick_start_time: 0.5     
heater: extruder          
heater_temp: 50.0       
fan_speed: 1.0         
off_below: 0            
tachometer_pin:THR:PA12
tachometer_ppr: 2
tachometer_poll_interval: 0.0005

[fan_generic cooling_fan]
pin:THR:PA8               
max_power: 1.0            
shutdown_speed:0          
cycle_time: 0.010         
hardware_pwm: False       
kick_start_time: 0.100    
off_below: 0.0            
tachometer_pin:THR:PA9    
tachometer_ppr: 2        
tachometer_poll_interval: 0.0015  

[controller_fan board_fan]
pin:PA9                   
max_power:1.0            
shutdown_speed:1.0       
cycle_time:0.01         
fan_speed: 1.0          
stepper:stepper_z,stepper_z1  

[fan_generic auxiliary_cooling_fan]
pin:PB15                  
shutdown_speed: 0.0       
cycle_time: 0.0100        
hardware_pwm: false       
kick_start_time: 0.100    
off_below: 0.0            
tachometer_pin:PC4        
tachometer_ppr: 2        
tachometer_poll_interval: 0.0015  

[output_pin polar_cooler]
pin: PB10                
pwm: false                
shutdown_value:0          
value:0  


[output_pin beeper]
pin:PC2                 
pwm: false              
shutdown_value:0        
value:0     

[output_pin caselight]
pin:PC9
pwm: false
shutdown_value:0
value:1

[gcode_arcs]
resolution: 1.0

[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 260, 260  
probe_count: 12, 12
algorithm: bicubic
bicubic_tension: 0.2
mesh_pps: 2, 2
zero_reference_position: 135, 135

[exclude_object]

[virtual_sdcard]
path: ~/printer_data/gcodes  # G代码文件路径
on_error_gcode: CANCEL_PRINT # 出错时取消打印

